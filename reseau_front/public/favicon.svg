<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Fond noir -->
  <rect width="512" height="512" fill="#000000" />

  <!-- Cercle principal -->
  <circle cx="256" cy="256" r="216" stroke="#ffffff" stroke-width="20" fill="none" />

  <!-- Nœud central -->
  <circle cx="256" cy="256" r="52" fill="#ffffff" />

  <!-- Rayons -->
  <g stroke="#ffffff" stroke-width="20" stroke-linecap="round">
    <line x1="256" y1="40" x2="256" y2="204" />
    <line x1="256" y1="308" x2="256" y2="472" />
    <line x1="40" y1="256" x2="204" y2="256" />
    <line x1="308" y1="256" x2="472" y2="256" />
    <line x1="116" y1="116" x2="204" y2="204" />
    <line x1="308" y1="308" x2="396" y2="396" />
    <line x1="396" y1="116" x2="308" y2="204" />
    <line x1="116" y1="396" x2="204" y2="308" />
  </g>

  <!-- Nœuds périphériques -->
  <g fill="#ffffff">
    <circle cx="256" cy="40" r="24" />
    <circle cx="256" cy="472" r="24" />
    <circle cx="40" cy="256" r="24" />
    <circle cx="472" cy="256" r="24" />
    <circle cx="116" cy="116" r="24" />
    <circle cx="116" cy="396" r="24" />
    <circle cx="396" cy="116" r="24" />
    <circle cx="396" cy="396" r="24" />
  </g>
</svg>
